# One command brings up the whole stack:
#
#   docker compose up -d --build
#
# This file owns the bot and the things only the bot needs. The other two
# services are pulled in whole, through `include`: each keeps its own
# docker-compose.yml, its own .env and its own dependencies (the AI service
# brings its Postgres, the search service its cookie mount). Nothing here
# reaches into their infrastructure — a service that cannot be started from its
# own repository is a service nobody can debug alone.
#
# `include` needs Docker Compose v2.20+ (`docker compose version`).
#
# It expects the three repositories checked out side by side, and compose is run
# from this one:
#
#   /srv/discord/
#     ├── discordAudio          <- run `docker compose up -d --build` here
#     ├── DiscordAiService
#     └── media-source-service
#
# Service names are the hostnames services find each other by, and they share
# one namespace across all three files — see the addresses in `environment`
# below. A name collision is a startup error, not a silent merge.
#
# The two paths are overridable from .env (AI_SERVICE_PATH, SEARCH_SERVICE_PATH)
# because a dev checkout rarely has all three under one parent — mine has them
# in GolandProjects and PycharmProjects. The defaults are the server layout.
#
# Each include names its own env_file. Without it, ${VAR} inside an included
# file is resolved against THIS directory's .env — measured: the AI service's
# ${POSTGRES_PASSWORD} failed to interpolate here while working fine standalone.
# That would have pushed every service's secrets into one shared .env, which is
# exactly the coupling `include` exists to avoid.
include:
  - path: ${AI_SERVICE_PATH:-../DiscordAiService}/docker-compose.yml
    env_file: ${AI_SERVICE_PATH:-../DiscordAiService}/.env
  - path: ${SEARCH_SERVICE_PATH:-../media-source-service}/docker-compose.yml
    env_file: ${SEARCH_SERVICE_PATH:-../media-source-service}/.env

services:
  # The bot's own Redis (track cache, Telegram log queue). Named bot-redis
  # because the AI service's compose already defines a `redis`, and the two hold
  # unrelated data.
  bot-redis:
    image: redis:7.2-alpine
    container_name: discord-bot-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - bot-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # The wake-word gate. Only the bot uses it, and it stays local by design: it is
  # what keeps non-command speech from ever leaving the machine.
  #
  # Small model, built here rather than pulled: 222MiB resident against 5.28GiB
  # for alphacep/kaldi-ru, with identical transcripts on the measured clips. See
  # deploy/vosk-gate/Dockerfile for the measurement and how to fall back.
  vosk:
    build: ./deploy/vosk-gate
    container_name: discord-vosk
    restart: unless-stopped

  bot:
    build: .
    container_name: discord-bot
    restart: unless-stopped
    env_file:
      - .env
    # These override .env on purpose. .env holds 127.0.0.1 addresses for running
    # the bot on a laptop; inside compose the services find each other by name.
    # One file cannot hold both, and overriding here keeps local runs working.
    environment:
      REDIS_ADDR: bot-redis:6379
      AI_SERVICE_ADDR: http://ai:8000
      PLAYBACK_SERVICE_ADDR: http://ai:8000
      SEARCH_SERVICE_ADDR: http://media-source-service:9000
      VOSK_SERVER_ADDR: ws://vosk:2700
      # The admin API binds 0.0.0.0 *inside the container*, which is reachable
      # only from this compose network — no `ports:` entry publishes it. The
      # loopback default that protects a laptop would here make it unreachable
      # from the gateway, which is the only thing meant to call it.
      ADMIN_ADDR: 0.0.0.0:8090
      TELEMETRY_FILE: /data/telemetry.jsonl
    volumes:
      # Survives `up --build`, so the history that explains a crash is still
      # there after the restart that followed it.
      - bot-telemetry:/data
    depends_on:
      bot-redis:
        condition: service_healthy
      vosk:
        condition: service_started

  # The admin panel's gateway. The ONLY service in the stack with a published
  # port: everything else talks over the compose network, and the panel's own
  # requests reach the bot and the AI service through here, carrying a service
  # token this container holds and the browser never sees.
  #
  # It authenticates people against Discord (OAuth2) and maps them to a role
  # from the ADMIN_*_IDS lists. With no lists set it refuses to start rather
  # than fall back to letting anyone in.
  admin:
    build:
      context: .
      dockerfile: deploy/admin/Dockerfile
    container_name: discord-admin
    restart: unless-stopped
    # Deliberately NOT `env_file: .env`, unlike every other service here. That
    # would hand this container the whole file — DISCORD_TOKEN, OPENAI_API_KEY,
    # TG_BOT_SECRET, POSTGRES_PASSWORD — and this is the one process reachable
    # from the internet. The code never reads them, but a process that is
    # compromised can read its own environment, so it is only given what it
    # actually needs. Values still come from .env, one at a time.
    environment:
      BOT_ADMIN_ADDR: http://bot:8090
      AI_ADMIN_ADDR: http://ai:8000
      ADMIN_CERT_CACHE: /data/certs

      # Service tokens for the two backends. Never sent to the browser.
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      AI_ADMIN_API_KEY: ${AI_ADMIN_API_KEY:-}

      # Who may sign in, and as what.
      ADMIN_OWNER_IDS: ${ADMIN_OWNER_IDS:-}
      ADMIN_MODERATOR_IDS: ${ADMIN_MODERATOR_IDS:-}
      ADMIN_VIEWER_IDS: ${ADMIN_VIEWER_IDS:-}

      # Discord OAuth2. The CLIENT SECRET is not the bot token: it can only
      # exchange authorization codes, never control the bot — which is why the
      # bot token has no business being in this container.
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      ADMIN_PUBLIC_URL: ${ADMIN_PUBLIC_URL:-}

      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:-}
      ADMIN_UI_ADDR: ${ADMIN_UI_ADDR:-:8080}
    volumes:
      # Certificates outlive the container: Let's Encrypt rate-limits issuance,
      # and rebuilding the image must not spend that budget every deploy.
      - admin-certs:/data
    ports:
      # 8080 is bound to loopback so that, with no ADMIN_DOMAIN set, the panel is
      # reachable only through an SSH tunnel. Setting ADMIN_DOMAIN switches the
      # gateway to :443 (plus :80 for the ACME challenge) — publish those two
      # instead when you go public.
      - "127.0.0.1:8080:8080"
    depends_on:
      bot:
        condition: service_started

volumes:
  bot-redis-data:
  bot-telemetry:
  admin-certs:
